name: Validate prototype
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:gate
      - run: npm test
      - run: npm run check

  ledger-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canopy_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: canopy_ledger_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U canopy_test -d canopy_ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tests/purchase-ledger.test.mjs
        env:
          CANOPY_TEST_DATABASE_URL: postgres://canopy_test:local_test_only@127.0.0.1:5432/canopy_ledger_test
