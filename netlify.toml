[build]
  command = "npm run build:gate && node tools/prepare-checkout-preview.mjs"
  publish = ".netlify/checkout-site"
[build.environment]
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[context.production]
  command = "node tools/refuse-production.mjs"
